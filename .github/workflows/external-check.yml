name: 외부 도구·화면 확인

# 윈도우·리눅스에서 "실제 외부 프로그램"과 "실제 브라우저로 화면 쓰기"를 확인한다: yt-dlp 검색, deep-filter 목소리 보정(README 의 설치 명령 그대로),
# Claude Code 설치·실행(로그인 없이 — AI 응답 자체는 토큰이 필요해서 확인하지 않는다), Chromium 으로 새 영상 화면에서 영상 올리기(화면 캡처를 남긴다).
# 인터넷 서비스(YouTube 등)에 닿아서 가끔 실패할 수 있어 평소 CI 와 분리했다. 수동 실행(workflow_dispatch) 또는 windows-verify 브랜치에 올릴 때만 돈다.
on:
  workflow_dispatch:
  push:
    branches: [windows-verify]

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      GH_TOKEN: ${{ github.token }}
      VAE_EXTERNAL: '1'
      VAE_UI_E2E: '1'
      VAE_SCREENSHOT_DIR: ${{ runner.temp }}/screens
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: ffmpeg (리눅스)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: ffmpeg (윈도우)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: npm i -g hyperframes
      - run: npm ci

      - name: yt-dlp (윈도우)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\ytdlp" | Out-Null
          gh release download -R yt-dlp/yt-dlp -p yt-dlp.exe -D "$env:RUNNER_TEMP\ytdlp"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\ytdlp"
      - name: yt-dlp (리눅스)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/ytdlp"
          gh release download -R yt-dlp/yt-dlp -p yt-dlp_linux -D "$RUNNER_TEMP/ytdlp"
          mv "$RUNNER_TEMP/ytdlp/yt-dlp_linux" "$RUNNER_TEMP/ytdlp/yt-dlp" && chmod +x "$RUNNER_TEMP/ytdlp/yt-dlp"
          echo "$RUNNER_TEMP/ytdlp" >> "$GITHUB_PATH"

      # README 의 "목소리 보정 설치" 명령을 그대로 실행한다(해시 확인 포함)
      - name: deep-filter (윈도우, README 명령 그대로)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$HOME\.local\share\deep-filter" | Out-Null; cd "$HOME\.local\share\deep-filter"
          gh release download v0.5.6 -R Rikorose/DeepFilterNet -p "deep-filter-0.5.6-x86_64-pc-windows-msvc.exe" -O deep-filter.exe
          if ((Get-FileHash -Algorithm SHA256 deep-filter.exe).Hash -ne '75E11FA16445F560CB6B021521DDB89E89270D13B83089705D98776F58FD7915') { throw '받은 파일의 해시가 달라요 — 지우고 다시 받으세요' } else { '해시 확인 OK' }
      - name: deep-filter (리눅스, README 명령 그대로)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          mkdir -p ~/.local/share/deep-filter && cd ~/.local/share/deep-filter
          gh release download v0.5.6 -R Rikorose/DeepFilterNet -p 'deep-filter-0.5.6-x86_64-unknown-linux-musl' -O deep-filter
          echo "70775e251eee44c0f2451a1e833326cf8bcbbe304d3e7cd12851e6fce72ef7da  deep-filter" | sha256sum -c -
          chmod +x deep-filter

      # Claude Code: PATH 에는 일부러 더하지 않는다 — 우리 코드가 ~/.local/bin 을 스스로 찾는지 본다
      - name: Claude Code (윈도우)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: irm https://claude.ai/install.ps1 | iex
      - name: Claude Code (리눅스)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: curl -fsSL https://claude.ai/install.sh | bash

      - name: Chromium (playwright, 저장소 설정은 바꾸지 않음)
        run: npm i --no-save playwright
      - name: Chromium 설치 (윈도우)
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - name: Chromium 설치 (리눅스)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: 확인 시험
        run: npx vitest run tests/external.test.ts tests/app.ui.e2e.test.ts

      - name: 화면 캡처
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens-${{ matrix.os }}
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore
